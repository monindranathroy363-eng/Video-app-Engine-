name: Build Android APK
on:
  push:
    paths:
      - 'app_config.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Original Code
        uses: actions/checkout@v4

      - name: Create Dummy Structure
        run: |
          mkdir -p master_app/assets/cfg
          cp app_config.json master_app/assets/cfg/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-video-app
          path: app_config.json
