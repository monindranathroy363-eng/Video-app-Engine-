
name: Build Android APK
on:
  push:
    paths:
      - 'app_config.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clone Master App Template
        run: |
          git clone https://github.com master_app
          cp app_config.json master_app/assets/cfg/ || true

      - name: Build APK
        run: |
          echo "মোবাইল APP তৈরি করা হচ্ছে..."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-video-app
          path: app_config.json
