<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZESTAPLAY - Global Mobile Video Network</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen">

    <header class="bg-slate-900 border-b border-purple-500/30 p-3 sticky top-0 z-40 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">ZESTAPLAY</h1>
        <div class="flex gap-2">
            <button onclick="toggleModal('adminModal', true)" class="text-slate-400 hover:text-white text-xs font-semibold px-1">Admin</button>
            <button onclick="toggleModal('regModal', true)" class="bg-gradient-to-r from-purple-600 to-pink-600 px-3 py-1.5 rounded-xl text-xs font-bold shadow-md active:scale-95 transition-all">Register</button>
        </div>
    </header>

    <main class="w-full max-w-md mx-auto p-3 space-y-4 pb-20">
        
        <div class="w-full aspect-video rounded-xl overflow-hidden border border-slate-800 bg-black shadow-xl">
            <iframe id="mainPlayer" class="w-full h-full" src="https://youtube.com" allowfullscreen></iframe>
        </div>

        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800/80 space-y-3">
            <div>
                <h2 id="videoTitle" class="text-sm font-bold tracking-wide leading-tight">Official ZESTAPLAY Cyber Stream Event 2026</h2>
                <p class="text-[10px] text-slate-400 mt-0.5">142,890 Viewers Live 4K Ultra HD</p>
            </div>
            <div class="flex justify-between items-center gap-2 border-t border-slate-800/60 pt-2.5">
                <button onclick="triggerLike()" id="likeBtn" class="flex-1 bg-slate-800 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1">Like <span id="likeCount">12.4K</span></button>
                <button onclick="toggleModal('shareModal', true)" class="flex-1 bg-slate-800 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1">Share</button>
                <button onclick="toggleModal('reportModal', true)" class="flex-1 bg-red-950/40 text-red-400 border border-red-900/40 py-2 rounded-xl text-[11px] font-bold">Report</button>
            </div>
        </div>

        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800/80 space-y-2">
            <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-cyan-400 uppercase tracking-wider">Monetization Split</span>
                <span class="text-[10px] text-emerald-400 font-bold bg-emerald-950/50 border border-emerald-900 px-2 py-0.5 rounded-full">Active</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-center text-xs">
                <div class="bg-slate-950 p-2 rounded-lg border border-slate-800/50"><p class="text-[9px] text-slate-400">Creator Share</p><p class="text-sm font-black text-purple-400">40%</p></div>
                <div class="bg-slate-950 p-2 rounded-lg border border-slate-800/50"><p class="text-[9px] text-slate-400">Platform Pool</p><p class="text-sm font-black text-cyan-400">60%</p></div>
            </div>
            <button onclick="applyMonetization()" class="w-full bg-gradient-to-r from-purple-600 to-cyan-500 py-2 rounded-xl font-bold text-xs uppercase tracking-wider">Turn On Monetization</button>
        </div>

        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800/80 space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-xs text-purple-400 uppercase tracking-wider">LIVE CHAT FEED</h3>
                <span id="commentTotal" class="bg-purple-950 text-purple-300 text-[9px] font-bold px-2 py-0.5 rounded-full">0 Comments</span>
            </div>
            <div class="space-y-2">
                <input type="text" id="comName" placeholder="Your Name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500">
                <div class="flex gap-2">
                    <input type="text" id="comMsg" placeholder="Join the discussion..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-500">
                    <button onclick="submitComment()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-xl font-bold text-xs">Send</button>
                </div>
            </div>
            <div id="commentBox" class="space-y-2 max-h-48 overflow-y-auto text-xs pr-1">
                <p id="noComText" class="text-center text-slate-500 py-2 italic">No live comments yet.</p>
            </div>
        </div>

        <div class="fixed bottom-3 left-1/2 -translate-x-1/2 w-full max-w-xs px-3 z-50">
            <button onclick="window.location.reload();" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 py-3 rounded-xl text-sm font-black uppercase tracking-wider shadow-lg shadow-cyan-500/20 border border-cyan-400/20">Download / Install App</button>
        </div>
    </main>

    <div id="regModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-purple-500/40 w-full max-w-xs p-4 rounded-xl space-y-3 shadow-2xl">
            <h3 class="text-sm font-black text-purple-400 uppercase tracking-wide">Identity Verification</h3>
            <div class="space-y-2 text-xs">
                <input type="text" id="regName" placeholder="Full Name" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
                <input type="text" id="regAddr" placeholder="Physical Address" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
                <input type="email" id="regEmail" placeholder="Gmail Address" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
                <input type="text" id="regPhone" placeholder="Mobile Number" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
                <input type="number" id="regAge" placeholder="Current Age (Must be 18+)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
            </div>
            <div class="flex gap-2 text-xs pt-1"><button onclick="toggleModal('regModal', false)" class="flex-1 bg-slate-800 py-2 rounded-lg font-bold">Cancel</button><button onclick="submitRegistration()" class="flex-1 bg-purple-600 py-2 rounded-lg font-bold">Verify</button></div>
        </div>
    </div>

    <div id="shareModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs p-4 rounded-xl space-y-3 text-center shadow-2xl">
            <h3 class="text-xs font-bold text-cyan-400 tracking-wide uppercase">Share Download Link</h3>
            <input type="text" readonly id="shareLink" value="https://github.io" class="w-full bg-slate-950 border border-slate-800 text-center font-mono rounded-lg p-2 text-[10px] text-cyan-300">
            <div class="flex gap-2 text-xs pt-1"><button onclick="toggleModal('shareModal', false)" class="flex-1 bg-slate-800 py-2 rounded-lg font-bold">Close</button><button onclick="copyShareLink()" class="flex-1 bg-cyan-600 py-2 rounded-lg font-bold">Copy Link</button></div>
        </div>
    </div>

    <div id="reportModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-red-900/60 w-full max-w-xs p-4 rounded-xl space-y-3 shadow-2xl">
            <h3 class="text-sm font-bold text-red-400 tracking-wide uppercase">Policy Report</h3>
            <select id="repReason" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs focus:outline-none"><option value="Copyright Infringement">Copyright Infringement</option><option value="Inappropriate Content">Inappropriate Content</option></select>
            <div class="flex gap-2 text-xs pt-1"><button onclick="toggleModal('reportModal', false)" class="flex-1 bg-slate-800 py-2 rounded-lg font-bold">Cancel</button><button onclick="submitContentReport()" class="flex-1 bg-red-600 py-2 rounded-lg font-bold">Submit</button></div>
        </div>
    </div>

    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-xs p-4 rounded-xl space-y-3 shadow-2xl">
            <h3 class="text-sm font-bold text-amber-400 tracking-wide uppercase">Secret Owner Control</h3>
            <div id="adminLoginArea" class="space-y-2">
                <input type="password" id="adminPass" placeholder="Master Password" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs">
                <button onclick="verifyAdminLogin()" class="w-full bg-amber-500 text-slate-950 py-2 rounded-lg font-bold text-xs uppercase tracking-wide">Login</button>
            </div>
            <div id="adminMainPanel" class="hidden space-y-2 text-xs">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="cfgSubs" value="20" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-center">
